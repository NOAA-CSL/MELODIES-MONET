# This YAML file has been last tested with MELODIES MONET version 1.1.

# This is an example file for specifying groups of files to loop over when using .util.tools.loop_pairing()
#
# First group for pairings. The name of this group, 0627_L1, will be the prefix of the saved netcdf files 
# each top level group will always consist of only 'model' and 'obs' as groups
'0627_L1': # file prefix label to be used when saving this group
  model: 
    # under model this will have pairs of [model dataset name as in control file]: [filenames to open]
    ufsaqm: '/wrk/d2/rschwantes/MM_example_data/ufschem/aqm.20230627/12/*dyn**.nc'
  obs: 
    # under model this will have pairs of [model dataset name as in control file]: [filenames to open]
    aeromma: '/wrk/d2/rschwantes/MM_example_data/obs/aeromma/short_AEROMMA-Merge_20230627_L1_20240410_1459.csv'
# Second group for pairings. The name of this group, 0627_L2, will be the prefix of the saved netcdf files 
'0627_L2': # file prefix label to be used when saving this group
  model:
    ufsaqm: '/wrk/d2/rschwantes/MM_example_data/ufschem/aqm.20230627/12/*dyn**.nc'
  obs:
    aeromma: '/wrk/d2/rschwantes/MM_example_data/obs/aeromma/short_AEROMMA-Merge_20230627_L2_20240410_1502.csv'
