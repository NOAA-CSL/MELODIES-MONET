# This YAML file has been last tested with MELODIES MONET version 1.1.

# This is an example file for specifying groups of files to loop over when using .util.tools.loop_pairing()
#
# First group for pairings. The name of this group, 0801, will be the prefix of the saved netcdf files 
# each top level group will always consist of only 'model' and 'obs' as groups
'0801': # file prefix label to be used when saving this group
  model: 
    # under model this will have pairs of [model dataset name as in control file]: [filenames to open]
    wrfchem_v4.2: '/wrk/d2/rschwantes/MM_example_data/output_w_3hr_raqms_fire_correct/wrfout_d01_2023-08-0[1,2]*'
  obs: 
    # under model this will have pairs of [model dataset name as in control file]: [filenames to open]
    aeromma: '/wrk/d2/rschwantes/MM_example_data/obs/aeromma/revised_AEROMMA_20230801_Merge_downloaded_Apr2025.csv'
# Second group for pairings. The name of this group, 0802, will be the prefix of the saved netcdf files 
'0802': # file prefix label to be used when saving this group
  model:
    wrfchem_v4.2: '/wrk/d2/rschwantes/MM_example_data/output_w_3hr_raqms_fire_correct/wrfout_d01_2023-08-02*'
  obs:
    aeromma: '/wrk/d2/rschwantes/MM_example_data/obs/aeromma/revised_AEROMMA_20230802_Merge_downloaded_Apr2025.csv'
