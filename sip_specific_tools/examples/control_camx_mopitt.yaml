# example yaml file to compare CAMx to MOPITT CO

analysis:
        start_time: '2022-07-20-00:00:00'
        end_time: '2022-07-21-00:59:00'
        output_dir:  ../../../finalSIP_ouptut
        debug: False
        pairing_kwargs:
                sat_grid_clm:
                        apply_ak: True
                        mod_to_overpass: True
        save:
          paired:
            method: 'netcdf'
            prefix: 'SIP'  
            data: all
        read:
          paired: 
            method: 'netcdf'
            filenames: 
                  {mopitt_camx: ['SIP_mopitt_camx.nc4']}

model:
        camx: 
                files: '/glade/work/plichtig/camx/processors/wrfcamx_v5.2/camx_input/CAMx73.cb7r1_cf3.20220720.35.camx.avrg.grd03.nc'
                files_vert: '/glade/work/plichtig/camx/processors/wrfcamx_v5.2/camx_input/camx.3d.4km_lonlatcorrected.20220720.nc'
                mod_type: 'camx'
                is_global: False
                mapping: 
                        mopitt: 
                                CO: column
                plot_kwargs: 
                        color: 'red'
                        marker: '^'
                        linestyle: 'dotted'
obs:
        mopitt:
                filename: ../../../MOPITT/MOP03J-20220720-L3V5.9.3.he5
                obs_type: sat_grid_clm
                sat_type: mopitt_l3
                variables:
                        column:
                                ylabel_plot: '$10^{18} molec/cm^{2}$'
                                vmin_plot: 0.0 # optMin for y-axis during plotting. To apply to a plot, change restrict_yaxis = True.
                                vmax_plot: 16
                                #vdiff_plot: 15.0
plots:
        plot_ts: 
               type: 'timeseries'
               fig_kwargs:
                       figsize: [12,6]
               default_plot_kwargs: # Opt to define defaults for all plots. Model kwargs overwrite these.
                       linewidth: 2.0
                       markersize: 10.
               text_kwargs: #Opt
                       fontsize: 18.
               domain_type: ['all']
               domain_name: ['Colorado']
               data: ['mopitt_camx']
               data_proc:
                       rem_obs_nan: True # True: Remove all points where model or obs variable is NaN. False: Remove only points where model variable is NaN.
                       ts_select_time: 'time' #Time used for avg and plotting: Options: 'time' for UTC or 'time_local'
                       ts_avg_window: 'D' # Options: None for no averaging or list pandas resample rule (e.g., 'h', 'D')
                       set_axis: True #If select True, add vmin_plot and vmax_plot for each variable in obs.
        plot_grp1:
                type: 'gridded_spatial_bias'
                fig_kwargs:
                        states: True
                        figsize: [10,5]
                        extent: [-110, -101, 36, 42]
                        counties: True
                        states: True
                        markersize: 500
                text_kwargs:
                        fontsize: 16.
                domain_type: ['custom:box']
                domain_name: ['Colorado']
                domain_info:
                        Colorado:
                                bounds: [-110, -101, 36, 42]
                data: ['mopitt_camx']
                data_proc:
                        rem_obs_nan: True
                        set_axis: True
