analysis:
  start_time : '2022-07-20'
  end_time : '2022-07-20'
  debug: True
  output_dir: './tropomi'
  output_dir_save: './tropomi'
  output_dir_read: './tropomi'
  save:
    paired:
      method: 'netcdf'
      prefix: '2022-07-20'  
      data: all
  read:
    paired: 
      method: 'netcdf'
      filenames: 
        {tropomi_l2_hcho_camx: ['2022-07-20_tropomi_l2_hcho_camx.nc4']}

model:
  camx: # model label
    files: /glade/campaign/acom/acom-da/Denver2024-SIP/Example_Files/CAMx73.cb7r1_cf3.20220720.35.camx.avrg.grd03.nc
    files_vert: /glade/campaign/acom/acom-da/Denver2024-SIP/Example_Files/camx.3d.4km_lonlatcorrected.20220720.nc
    mod_type: "camx"
    surf_only: False  
    mapping: # of _model_ species name to _obs_ species name
      tropomi_l2_hcho: 
        FORM: "formaldehyde_tropospheric_vertical_column"
    projection: ~
    plot_kwargs: # optional
      color: "magenta"
      marker: "s"
      linestyle: "-"
obs:
  tropomi_l2_hcho:
    debug: True
    filename: ./tropomi/S5P_OFFL_L2__HCHO___20220720*
    obs_type: sat_swath_clm
    sat_type: tropomi_l2_hcho
    sat_method: apply_ak
    variables:
      "formaldehyde_tropospheric_vertical_column": {"quality_flag": "qa_value", "qa_thresh_min": 0.5}
      "averaging_kernel": {}

plots:
  plt_grp1:
    type: 'spatial_dist'
    fig_kwargs:
      states: True
      counties: True
#      extent: [-130, -60., 25, 52]  # Lon,Lon,Lat,Lat
      cmap: 'Spectral_r'
    text_kwargs:
      fontsize: 16
    domain_type: ["all", "auto-region:box"]
    domain_name: ["Colorado", "FrontRange"]
    domain_info:
      FrontRange:
        bounds: [-105.4, -103.8, 39.2, 40.9]
    data: ['tropomi_l2_hcho_camx']
    data_proc:
      set_axis: False
      vmin_plot: 0
      vmax_plot: 2e16
  
  plt_grp2:
    type: 'gridded_spatial_bias'
    fig_kwargs:
      states: True
      counties: True
      cmap: 'RdBu_r'
    text_kwargs:
      fontsize: 16
    domain_type: ["all", "auto-region:box"]
    domain_name: ["Colorado", "FrontRange"]
    domain_info:
      FrontRange:
        bounds: [-105.4, -103.8, 39.2, 40.9]
    data: ['tropomi_l2_hcho_camx']
    data_proc:
      set_axis: False
      vdiff_plot: 5e15

  plot_grp5:
    type: 'timeseries'
    fig_kwargs:
      figsize: [12,6]
    default_plot_kwargs:
      linewidth: 2.0
      markersize: 10.
    text_kwargs:
      fontsize: 18.
    domain_type: ["all", "auto-region:box"]
    domain_name: ["Colorado", "FrontRange"]
    domain_info:
      FrontRange:
        bounds: [-105.4, -103.8, 39.2, 40.9]
    data: ["tropomi_l2_hcho_camx"]
    data_proc:
      ts_offset: (-6, 'h')
      ts_avg_window: 'h'
      set_yaxis: True
      
stats:
  stat_list: ["MB", "MdnB", "R2", "RMSE","MdnO","MO","MdnP","MP","FB"]
  round_output: 3 # optional; defaults to rounding to 3rd decimal place
  output_table: True
  output_table_kwargs: # optional
    figsize: [7, 3]
    fontsize: 12.
    xscale: 1.4
    yscale: 1.4
    edges: "horizontal"
    format: "{:.3e}" #"{.2f}", it would be a float with 2 decimal digits
  domain_type: ["all", "auto-region:box"]
  domain_name: ["Colorado", "FrontRange"]
  domain_info:
      FrontRange:
        bounds: [-105.4, -103.8, 39.2, 40.9]
  data: ["tropomi_l2_hcho_camx"]